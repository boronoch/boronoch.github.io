{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Cycles</h2>
  <p><a href="{{ url_for('new_cycle') }}"><button>Start a new 4-week cycle</button></a></p>
  <table>
    <tr><th>Label</th><th>Created</th><th>Active</th><th></th></tr>
    {% for c in cycles %}
    <tr>
      <td>{{ c.label }}</td>
      <td>{{ c.created_at[:10] }}</td>
      <td>{{ 'Yes' if c.is_active else '' }}</td>
      <td>
        {% if not c.is_active %}
        <form method="post" action="{{ url_for('activate_cycle', cycle_id=c.id) }}">
          <button type="submit">Make active</button>
        </form>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
