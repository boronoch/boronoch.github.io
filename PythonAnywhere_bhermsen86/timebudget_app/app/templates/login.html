{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Log in</h2>
  <form method="post">
    <label>Username</label>
    <input name="username" required autofocus>
    <label>Password</label>
    <input name="password" type="password" required>
    <p><button type="submit">Log in</button></p>
  </form>
</div>
{% endblock %}
