{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Time Inventory (Items)</h2>
  <table>
    <tr><th>Description</th><th>Category</th><th>Priority</th><th>Hrs/Week</th><th></th></tr>
    {% for it in items %}
    <tr>
      <td>{{ it.description }}</td>
      <td><span class="swatch" style="background:#{{ it.category_color or 'CCCCCC' }}"></span>{{ it.category_name or '' }}</td>
      <td>{{ it.priority }}</td>
      <td>{{ it.weekly_target_hours }}</td>
      <td>
        <form method="post" action="{{ url_for('delete_item', item_id=it.id) }}" onsubmit="return confirm('Remove this item?');">
          <button type="submit">Remove</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
</div>

<div class="card">
  <h3>Add an item</h3>
  <form method="post">
    <label>Description</label>
    <input name="description" required>
    <label>Category</label>
    <select name="category_id">
      {% for c in categories %}
      <option value="{{ c.id }}">{{ c.name }}</option>
      {% endfor %}
    </select>
    <label>Priority</label>
    <select name="priority">
      <option>High</option>
      <option selected>Medium</option>
      <option>Low</option>
    </select>
    <label>Hrs/Week Target</label>
    <input name="weekly_target_hours" type="number" step="0.5" value="1">
    <p><button type="submit">Add item</button></p>
  </form>
</div>
{% endblock %}
