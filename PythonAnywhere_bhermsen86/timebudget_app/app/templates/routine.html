const taskListEl = document.getElementById('taskList');
let currentState = { date: null, selected_column: 'Monday', checks: {} };

function getCentralTime() {
  const now = new Date();
  return new Date(now.toLocaleString('en-US', { timeZone: 'America/Chicago' }));
}

function renderDate() {
  const el = document.getElementById('currentDate');
  el.textContent = getCentralTime().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
}

function updateTaskStatus(taskSpan, checkbox, time) {
  if (checkbox.checked) {
    taskSpan.className = 'completed';
    return;
  }
  const currentTime = getCentralTime();
  const taskTime = new Date(currentTime);
  if (time) {
    const [hours, minutes] = time.split(':');
    taskTime.setHours(parseInt(hours), parseInt(minutes), 0);
    taskSpan.className = taskTime > currentTime ? 'pending' : 'active';
  } else {
    taskSpan.className = 'pending';
  }
}

function saveCheck(column, index, checked) {
  fetch("{{ url_for('routine_check_api') }}", {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ column: column, index: index, checked: checked })
  });
}

function createTaskList(columnName) {
  const tasks = columns[columnName] || [];
  const checkedSet = new Set(currentState.checks[columnName] || []);
  taskListEl.innerHTML = '';

  tasks.forEach((task, index) => {
    const taskDiv = document.createElement('div');
    taskDiv.className = 'task';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = `task-${index}`;
    checkbox.checked = checkedSet.has(index);

    const label = document.createElement('label');
    label.htmlFor = `task-${index}`;

    const taskSpan = document.createElement('span');
    taskSpan.textContent = task.time ? `${task.time} - ${task.description}` : task.description;

    checkbox.addEventListener('change', () => {
      updateTaskStatus(taskSpan, checkbox, task.time);
      saveCheck(columnName, index, checkbox.checked);
    });

    updateTaskStatus(taskSpan, checkbox, task.time);

    label.appendChild(taskSpan);
    taskDiv.appendChild(checkbox);
    taskDiv.appendChild(label);
    taskListEl.appendChild(taskDiv);
  });
}

function selectColumn(columnName, save) {
  document.querySelectorAll('input[name="taskColumn"]').forEach(r => {
    r.checked = (r.value === columnName);
  });
  createTaskList(columnName);
  if (save) {
    fetch("{{ url_for('routine_column_api') }}", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ column: columnName })
    });
  }
}

document.querySelectorAll('input[name="taskColumn"]').forEach(radio => {
  radio.addEventListener('change', (event) => selectColumn(event.target.value, true));
});

renderDate();
fetch("{{ url_for('routine_state_api') }}")
  .then(r => r.json())
  .then(state => {
    currentState = state;
    selectColumn(state.selected_column || 'Monday', false);
