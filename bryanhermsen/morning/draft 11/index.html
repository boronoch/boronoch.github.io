<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morning Schedule</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Morning Schedule</h1>
  
  <div class="column-selector">
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="Monday" checked>
        Monday
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="TuesdayAM">
        Tuesday Morning
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="TuesdayAMSwim">
        Tuesday Morning with Swim
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="Wednesday">
        Wednesday
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="Thursday">
        Thursday
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="Friday">
        Friday
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="Saturday">
        Saturday
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="Sunday">
        Sunday
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="tasksColumn1">
        Office
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="tasksColumn2">
        Work from Home
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="tasksColumn3">
        Home with Workout
      </label>
    </div><div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="tasksColumn4">
        Waukesha
      </label>
    </div>
  </div>

  <div id="taskList" class="task-list"></div>

  <script src="script.js"></script>
  
  <div>
    <h3>Workout Routine</h3>
    Friday: Run or Bike<br>
    Saturday: Swim or Lift<br>
    Sunday: Bike or Lift<br>
    Tuesday: optional swim
  </div>
</body>
</html>
