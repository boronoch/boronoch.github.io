<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morning Schedule</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Morning Schedule</h1>
  
  <div class="column-selector">
    <div class="radio-option">
      <label>
        <input type="radio" name="column" value="column1" checked>
        Office
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="column" value="column2">
        Work from Home
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="column" value="column3">
        Custom Tasks
      </label>
    </div>
  </div>

  <div class="schedule-container">
    <div id="taskList1" class="task-list"></div>
    <div id="taskList2" class="task-list"></div>
    <div id="taskList3" class="task-list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
