<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morning Schedule</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Morning Schedule</h1>
  
  <div class="column-selector">
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="tasksColumn1" checked>
        Office
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="tasksColumn2">
        Work from Home
      </label>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="taskColumn" value="tasksColumn3">
        Custom Schedule
      </label>
    </div>
  </div>

  <div id="taskList" class="task-list"></div>

  <script src="script.js"></script>
</body>
</html>
